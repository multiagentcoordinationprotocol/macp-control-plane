# npm resolves the private @multiagentcoordinationprotocol/proto package from
# GitHub Packages; that needs a Dependabot secret DEPENDABOT_GHPR_TOKEN (classic
# PAT, read:packages) for the registry below.
version: 2
registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_GHPR_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    registries: ['github-npm']
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      major-updates:
        update-types: ['major']
    ignore:
      - dependency-name: '@multiagentcoordinationprotocol/proto'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
