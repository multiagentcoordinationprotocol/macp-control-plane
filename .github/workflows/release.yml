name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Warn on package.json / tag version drift
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json before the next release."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build locally first so Trivy gates BEFORE anything reaches the registry.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:scan-target
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha

      - name: Trivy scan (release gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:scan-target
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Every layer is already cached from the scan build — this is near-instant.
      - name: Push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)

  # Remote deploy stays dormant until the DEPLOY_SSH_* secrets exist — see
  # .github/workflows/deploy.yml for the manual/workflow_dispatch path.
