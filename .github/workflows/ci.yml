name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; never cancel in-flight main pushes (a killed
# docker job mid-push can leave a partial `latest` tag in GHCR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@multiagentcoordinationprotocol'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@multiagentcoordinationprotocol'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@multiagentcoordinationprotocol'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test -- --coverage --passWithNoTests --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
            console.log("## Coverage\n\n| Metric | Coverage |\n|---|---|");
            for (const k of ["lines","statements","functions","branches"]) console.log(row(k));
          ' >> "$GITHUB_STEP_SUMMARY" || echo "No coverage summary found" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: macp_control_plane_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@multiagentcoordinationprotocol'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/macp_control_plane_test
        run: npx ts-node src/db/migrate.ts
      - name: Run integration tests
        env:
          CI: true
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/macp_control_plane_test
          NODE_ENV: development
          AUTH_API_KEYS: test-key-ci
          OTEL_ENABLED: false
          LOG_LEVEL: warn
          RUNTIME_ALLOW_INSECURE: true
          RUN_RECOVERY_ENABLED: false
          INTEGRATION_RUNTIME: mock
        run: npm run test:integration

  # Report-only for now: the current dependency tree has high/critical advisories
  # with no non-breaking fix (e.g. multer / path-to-regexp via @nestjs, protobufjs
  # via otel), so a hard gate would fail every build until those are upgraded.
  # Step-level `continue-on-error` keeps the job (and its PR check) green while the
  # advisories stay visible in the step log.
  # TODO: after the dependency-advisory cleanup, remove continue-on-error and add
  # `audit` back to the `build` job's `needs` to make this blocking.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Advisory lookups go to registry.npmjs.org from the lockfile alone — no
      # npm ci needed. NODE_AUTH_TOKEN must still be set because the committed
      # .npmrc references it and npm fails on any unexpanded env var.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-env-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for leaked secrets in tracked files
        run: |
          # Fail if any tracked file contains common secret patterns
          # (API keys, tokens, passwords in plain text)
          PATTERNS='(sk-proj-|sk-[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*["\x27][^"\x27]{8,})'
          if git ls-files | xargs grep -lPn "$PATTERNS" -- 2>/dev/null | grep -v '.env.example' | grep -v '.npmrc' | grep -v 'node_modules' | grep -v 'ci.yml'; then
            echo "::error::Potential secrets found in tracked files. Review the matches above."
            exit 1
          fi
          echo "No leaked secrets detected."

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce code conventions (see CLAUDE.md)
        run: |
          set -o pipefail
          fail=0

          echo "::group::throw new Error outside allowed files"
          if grep -rn "throw new Error" src --include='*.ts' | grep -vE '(app-config|migrate|\.spec\.ts|circuit-breaker\.ts|proto-registry\.service\.ts|grpc-helpers\.ts|run\.repository\.ts|webhook\.service\.ts|run-recovery\.service\.ts|runtime-jwt-minter\.service\.ts)'; then
            echo "::error::throw new Error found outside allowed files. Use AppException or a Nest built-in."
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::console.* outside migrate / specs"
          if grep -rn 'console\.' src --include='*.ts' | grep -vE '(migrate|\.spec\.ts)'; then
            echo "::error::console.* found outside migrate / tests. Use Nest Logger instead."
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::process.env outside allowed files"
          if grep -rn 'process\.env' src --include='*.ts' | grep -vE '(app-config|main\.ts|telemetry/telemetry\.ts|db/migrate\.ts|\.spec\.ts)'; then
            echo "::error::process.env read outside app-config/main/telemetry/migrate. Centralize in AppConfigService."
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::Observer-only: no write-path endpoints reintroduced"
          if grep -rn 'POST.*runs/:id/\(messages\|signal\|context\)' src --include='*.ts' | grep -vE '(gone\(|\.spec\.ts|REMOVED|deprecated)'; then
            echo "::error::Write-path endpoint references found. Control-plane is observer-only (direct-agent-auth)."
            fail=1
          fi
          echo "::endgroup::"

          exit $fail

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, check-env-secrets, conventions]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@multiagentcoordinationprotocol'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build

  # Builds on every PR (no push) so Dockerfile breakage is caught before merge;
  # pushes to GHCR + Trivy-scans only on main.
  docker:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build (and push on main)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # Report-only on main (the image is already pushed at this point). The hard
      # CRITICAL gate lives in release.yml, which scans BEFORE pushing a tag.
      - name: Trivy scan (main image)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
