name: Deploy

# Manual deploy to the production VM over SSH. Dormant until the three
# DEPLOY_SSH_* Actions secrets are configured (the job is skipped otherwise).
# The VM must have Docker + Compose v2, a GHCR read-only login, and this
# repo's deploy/ directory at /opt/macp (see deploy/README.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_* secrets not configured — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/macp
            ./deploy.sh deploy ${{ inputs.tag }}
